[llm]
# Ollama and every OpenAI-compatible service use the same chat-completions client.
provider = "ollama"
model = "qwen3.6:27b"
base_url = "http://127.0.0.1:11434/v1"
# This endpoint is an SSH tunnel to another host; never run local Ollama commands.
manage_local = false
timeout_seconds = 900
retries = 2
# temperature = 0.2

[decision]
# Strands Decider runs as a separate local service; Distil talks to its HTTP API.
# When disabled or unavailable, new items are included by deterministic safe fallback.
enabled = true
base_url = "http://127.0.0.1:8000"
confidence_threshold = 0.9
timeout_seconds = 10

[output]
directory = "~/distils"
reading_time_minutes = 5

[domain]
focus = "drug discovery, pharmacology, AI/ML for therapeutics"

[[feeds]]
url = "https://rss.arxiv.org/rss/cs.ai"
name = "arXiv AI"
max_items = 5
keywords = ["drug", "molecule", "protein", "medical", "clinical", "pharma", "SMILES", "docking", "binding", "therapeutic"]

[[feeds]]
url = "https://connect.biorxiv.org/biorxiv_xml.php?subject=pharmacology+biochemistry+toxicology"
name = "bioRxiv Pharma"
max_items = 5

[[feeds]]
url = "https://news.ycombinator.com/rss"
name = "Hacker News"
max_items = 5
# pattern = "(?i)(biotech|drug|pharma|protein|alphafold)"

