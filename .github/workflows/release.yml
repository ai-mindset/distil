name: Cross-platform packaging

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_RUNTIME_VERSION: 1.4.3

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run quality

  linux:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_RUNTIME_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Compile Bun executable
        run: |
          mkdir -p dist
          bun build --compile --minify --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig \
            --target=bun-linux-x64 \
            --outfile dist/distil \
            src/main.ts
      - name: Smoke-test executable
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          test "$(dist/distil --version)" = "distil ${version}"
          dist/distil --help
          dist/distil serve --config /tmp/distil-smoke-missing.toml \
            --host 127.0.0.1 --port 51571 --no-browser > /tmp/distil-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:51571/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/distil-smoke.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:51571/assets/distil-logo.png \
            -o /tmp/distil-smoke-logo.png
          cmp assets/distil-logo.png /tmp/distil-smoke-logo.png
      - name: Package release archive
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          name="distil-v${version}-linux-x86_64"
          package="dist/release/${name}"
          mkdir -p "$package"
          cp dist/distil config.toml README.md LICENSE "$package/"
          chmod +x "$package/distil"
          tar -czf "dist/${name}.tar.gz" \
            -C "$package" distil config.toml README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: distil-linux-x86_64
          path: dist/distil-v*-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_RUNTIME_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Compile Bun executable
        run: |
          mkdir -p dist
          bun build --compile --minify --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig \
            --target=bun-darwin-arm64 \
            --outfile dist/distil \
            src/main.ts
      - name: Smoke-test executable
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          test "$(dist/distil --version)" = "distil ${version}"
          dist/distil --help
      - name: Package release archive
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          name="distil-v${version}-macos-aarch64"
          package="dist/release/${name}"
          mkdir -p "$package"
          cp dist/distil config.toml README.md LICENSE "$package/"
          chmod +x "$package/distil"
          tar -czf "dist/${name}.tar.gz" \
            -C "$package" distil config.toml README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: distil-macos-aarch64
          path: dist/distil-v*-macos-aarch64.tar.gz
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_RUNTIME_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Compile Bun executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          bun build --compile --minify --no-compile-autoload-dotenv `
            --no-compile-autoload-bunfig `
            --target=bun-windows-x64 `
            --outfile dist/distil.exe `
            src/main.ts
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $actual = & "dist/distil.exe" --version
          if ($actual -ne "distil $version") {
            throw "Compiled version '$actual' does not match package.json version '$version'"
          }
          & "dist/distil.exe" --help
      - name: Package release archive
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $name = "distil-v$version-windows-x86_64"
          $package = Join-Path "dist/release" $name
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "dist/distil.exe" $package
          Copy-Item "config.toml" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath (Join-Path "dist" "$name.zip") `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: distil-windows-x86_64
          path: dist/distil-v*-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          version="$(jq -r '.version' package.json)"
          expected="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match package.json version $expected"
            exit 1
          fi

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: distil-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          prefix="distil-${GITHUB_REF_NAME}"
          sha256sum \
            "${prefix}-linux-x86_64.tar.gz" \
            "${prefix}-macos-aarch64.tar.gz" \
            "${prefix}-windows-x86_64.zip" \
            > SHA256SUMS

      - name: Attest release archives and checksums
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="distil-${GITHUB_REF_NAME}"
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            "${prefix}-linux-x86_64.tar.gz" \
            "${prefix}-macos-aarch64.tar.gz" \
            "${prefix}-windows-x86_64.zip" | sort)"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            actual_assets="$(gh release view "$GITHUB_REF_NAME" \
              --json assets --jq '.assets[].name' | sort)"
            if [[ "$actual_assets" != "$expected_assets" ]]; then
              echo "::error::Release $GITHUB_REF_NAME already exists with unexpected assets; refusing to overwrite it"
              exit 1
            fi
            echo "Release $GITHUB_REF_NAME already has the expected assets."
            exit 0
          fi

          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "release-assets/${prefix}-linux-x86_64.tar.gz" \
            "release-assets/${prefix}-macos-aarch64.tar.gz" \
            "release-assets/${prefix}-windows-x86_64.zip" \
            release-assets/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            --title "Distil $GITHUB_REF_NAME" \
            "${prerelease[@]}"
